spring.application.name=springboot-otp-backend

#DB props
spring.datasource.url=jdbc:mysql://localhost:3306/spring_otp_db
spring.datasource.username=root
spring.datasource.password=RupeshDB@2356
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true



# Email (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio (SMS)
twilio.account_sid=your_account_sid
twilio.auth_token=your_auth_token
twilio.phone_number=+1234567890

# JWT
jwt.secret=mySecretKeyForJWTGeneration12345
jwt.expirationMs=3600000